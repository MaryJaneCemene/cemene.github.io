<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
.card-box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:400px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<div class="card-box">

<h3>Register</h3>

<form id="registerForm">

<input type="text" id="fullname" class="form-control mb-2" placeholder="Full Name" required>
<input type="text" id="username" class="form-control mb-2" placeholder="Username" required>
<input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
<input type="text" id="contact" class="form-control mb-2" placeholder="Contact" required>
<input type="text" id="address" class="form-control mb-2" placeholder="Address" required>
<input type="password" id="password" class="form-control mb-2" placeholder="Password" required>
<input type="file" id="profile_pic" class="form-control mb-3" required>

<button class="btn btn-primary w-100">Register</button>

</form>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    const file = document.getElementById("profile_pic").files[0];
    if(!file){
        alert("Upload image first");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){

        const user = {
            fullname: fullname.value,
            username: username.value,
            email: email.value,
            contact: contact.value,
            address: address.value,
            password: password.value,
            profilePic: event.target.result
        };

        localStorage.setItem("user_" + user.username, JSON.stringify(user));

        alert("Registered Successfully!");
        window.location.href = "login.html";
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
