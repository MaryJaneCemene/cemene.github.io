<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | MyApplication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .split-container { display: flex; height: 100vh; width: 100vw; }
        .left-side { flex: 1; background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .right-side { flex: 1; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; color: white; }
        .content-box { max-width: 400px; width: 100%; }
        .hero-text { font-size: 3.5rem; font-weight: 800; line-height: 1; margin-bottom: 20px; color: #0f172a; }
        .btn-dark-custom { background: #0f172a; color: white; padding: 15px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-block; transition: 0.3s; border: 2px solid #0f172a; }
        .btn-dark-custom:hover { background: transparent; color: #0f172a; }
        .btn-outline-custom { background: transparent; color: #0f172a; padding: 15px 30px; border-radius: 50px; font-weight: 600; text-decoration: none; display: inline-block; transition: 0.3s; border: 2px solid #e2e8f0; margin-left: 10px; }
        .btn-outline-custom:hover { border-color: #0f172a; }
        .circle-decor { position: absolute; width: 300px; height: 300px; background: linear-gradient(45deg, #3b82f6, #2dd4bf); border-radius: 50%; filter: blur(80px); opacity: 0.5; }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="left-side">
            <div class="content-box">
                <div class="hero-text">Next Gen Portal.</div>
                <p class="text-muted mb-4">Experience a seamless way to manage your profile and data with our high-speed interface.</p>
                <div class="d-flex">
                    <a href="login.html" class="btn-dark-custom">Sign In</a>
                    <a href="register.html" class="btn-outline-custom">Create Account</a>
                </div>
            </div>
        </div>
        <div class="right-side">
            <div class="circle-decor"></div>
            <h2 style="z-index: 1; font-weight: 300; letter-spacing: 5px;">MY / APP</h2>
        </div>
    </div>
</body>
</html>
