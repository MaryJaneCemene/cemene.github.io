<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h3>MY APP</h3>

        <img id="profileImage" class="profile-img mt-4">

        <h5 class="mt-3" id="displayName">User</h5>

        <button onclick="logout()" class="btn btn-danger mt-4">
            Logout
        </button>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- WELCOME -->
        <div class="card-box">
            <h2>Welcome, <span id="welcomeName"></span></h2>
        </div>

        <!-- PERSONAL INFO -->
        <div class="card-box">
            <h4 class="section-title">Personal Information</h4>

            <div class="row">
                <div class="col-md-6">
                    <strong>Full Name</strong>
                    <p id="fullName"></p>
                </div>

                <div class="col-md-6">
                    <strong>Email</strong>
                    <p id="email"></p>
                </div>

                <div class="col-md-6">
                    <strong>Contact</strong>
                    <p id="contact"></p>
                </div>

                <div class="col-md-6">
                    <strong>Address</strong>
                    <p id="address"></p>
                </div>
            </div>
        </div>

        <!-- EDUCATIONAL BACKGROUND -->
        <div class="card-box">
            <h4 class="section-title">Educational Background</h4>

            <div class="row">
                <div class="col-md-6">
                    <strong>School</strong>
                    <p>Jose Rizal Memorial State University</p>
                </div>

                <div class="col-md-6">
                    <strong>Course</strong>
                    <p>BS Information Technology</p>
                </div>

                <div class="col-md-6">
                    <strong>Year Level</strong>
                    <p>2nd Year</p>
                </div>

                <div class="col-md-6">
                    <strong>Status</strong>
                    <p>Currently Enrolled</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script>
// SAFE LOGIN CHECK
const userData = sessionStorage.getItem('activeUserData');

if (!userData) {
    alert("Please login first!");
    window.location.href = "login.html";
} else {

    const user = JSON.parse(userData);

    // PROFILE IMAGE SAFETY
    if (user.profilePic) {
        document.getElementById('profileImage').src = user.profilePic;
    }

    document.getElementById('displayName').innerText = user.username || "User";
    document.getElementById('welcomeName').innerText = user.username || "User";

    document.getElementById('fullName').innerText = user.fullname || "";
    document.getElementById('email').innerText = user.email || "";
    document.getElementById('contact').innerText = user.contact || "";
    document.getElementById('address').innerText = user.address || "";
}

// LOGOUT
function logout() {
    sessionStorage.removeItem('activeUserData');
    window.location.href = "login.html";
}
</script>

</body>
</html>
