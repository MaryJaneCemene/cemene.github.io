<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyApplication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); width: 100%; max-width: 400px; }
        .form-control { border: 2px solid #f1f5f9; padding: 12px; border-radius: 12px; }
        .form-control:focus { border-color: #3b82f6; box-shadow: none; }
        .btn-primary { background: #3b82f6; border: none; padding: 12px; border-radius: 12px; font-weight: 600; margin-top: 10px; }
        .link-muted { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .link-muted:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h4 class="fw-bold mb-1">Welcome back.</h4>
        <p class="text-muted mb-4 small">Please enter your details to sign in.</p>
        
        <div id="errorMsg" class="alert alert-danger d-none p-2 text-center small rounded-3"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="small fw-bold text-uppercase text-muted">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="small fw-bold text-uppercase text-muted">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
            <div class="text-center">
                <a href="register.html" class="link-muted">Don't have an account? Sign up</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const savedData = localStorage.getItem('user_' + username);

            if (savedData) {
                const user = JSON.parse(savedData);
                if (user.password === password) {
                    sessionStorage.setItem('loggedInUser', username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = "Incorrect password.";
                    errorMsg.classList.remove('d-none');
                }
            } else {
                errorMsg.textContent = "Account not found.";
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
