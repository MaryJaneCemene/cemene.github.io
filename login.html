<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="width:350px">

<h3 class="mb-3">Login</h3>

<form id="loginForm">

<input type="text" id="username" class="form-control mb-2" placeholder="Username" required>
<input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

<button class="btn btn-primary w-100">Login</button>

</form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const savedUser = localStorage.getItem("user_" + username);

    if(!savedUser){
        alert("Account not found!");
        return;
    }

    const user = JSON.parse(savedUser);

    console.log("DB Password:", user.password);
    console.log("Input Password:", password);

    if(user.password === password){

        sessionStorage.setItem("activeUserData", JSON.stringify(user));

        alert("Login Successful!");
        window.location.href = "dashboard.html";

    } else {
        alert("Incorrect password!");
    }
});
</script>

</body>
</html>
