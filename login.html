<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
.card-box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:400px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

<div class="card-box">

<h3>Login</h3>

<form id="loginForm">

<input type="text" id="username" class="form-control mb-2" placeholder="Username" required>
<input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

<button class="btn btn-primary w-100">Login</button>

</form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const userData = localStorage.getItem("user_" + username.value);

    if(!userData){
        alert("Account not found!");
        return;
    }

    const user = JSON.parse(userData);

    if(user.password === password.value){

        sessionStorage.setItem("activeUserData", JSON.stringify(user));

        alert("Login Successful!");

        window.location.href = "dashboard.html";

    } else {
        alert("Wrong password!");
    }
});
</script>

</body>
</html>
